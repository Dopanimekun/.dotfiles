#################################
#             Text              #
#################################

# font_family      FiraCode Nerd Font Mono
font_family      BigBlueTermPlus Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0
font_antialias full
font_hinting full
disable_ligatures never


#################################
#             Window            #
#################################

#logo#
# window_logo_position can be top-left, top, top-right, left, center, right, bottom-left, bottom, bottom-right #
window_logo_path ./images/bernice.png
window_logo_position bottom-right
window_logo_alpha 0.8
window_logo_scale 20
#resize_debounce_time 0.1 0.5

#size#
#window_margin_width 5
#window_padding_width 6

#################################
#             Cursor            #
#################################

cursor #ff89c6
cursor_text_color #ffffff

#################################
#             Colors            #
#################################

#background#
background #000200
background_opacity 0.80
background_blur 40
# dynamic_background_opacity
#foreground#
foreground #FFFFFF

#color scheme#

# doing black color function #
color0       #001B44
color8       #003544

# doing red color function #
color1       #FF0099
color9       #CC00CC

# doing green color function #
color2       #00EEFF
color10      #3399FF

# doing yellow color function #
color3       #FF9900
color11      #FFEE00

# doing blue color function #
color4       #00CC66
color12      #44FF88

# doing magenta color function #
color5       #FF33CC
color13      #AA00FF

# doing cyan color function #
color6       #0196DD
color14      #00FFD9

# doing white color function #
color7       #BADDFF
color15      #94C9FF

#################################
#             Others            #
#################################

scrollback_lines 2000
sync_to_monitor yes
