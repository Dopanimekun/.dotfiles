# Environment setup, pretty easy

# auto-start #

exec-once = quickshell
exec-once = awww-daemon
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"

# scripts #
# portal-fix is for pc's with 2 or more DE's

exec-once = ~/.config/autostart/portal-fix.sh
exec-once = ~/.config/hypr/scripts/wallpaper-rotation.sh
exec-once = ~/.config/hypr/scripts/xdg-defaults-hyprland.sh

# environment variables #

env = XCURSOR_THEME,tetoW
env = XCURSOR_SIZE,32
env = HYPRCURSOR_THEME,tetoW
env = HYPRCURSOR_SIZE,32
env = QT_QPA_PLATFORMTHEME,qt6ct
env = XDG_MENU_PREFIX,arch-
